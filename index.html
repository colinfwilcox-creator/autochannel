<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoChannel — Live Game Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>🏈 AutoChannel Dashboard</h1>
      <p id="status" class="status-line">Initializing...</p>
    </div>
    <div class="venue-info">
      <span class="venue-name" id="venue-name">Barking Dog, Bethesda MD</span>
      <span class="refresh-indicator" id="source-indicator">Loading…</span>
    </div>
  </header>

  <main>
    <div id="error-banner" class="error-banner" role="alert" hidden></div>
    <div id="dashboard" class="dashboard">
      <p>Loading...</p>
    </div>
  </main>

  <!-- Load config first -->
  <script src="config/venue.js"></script>
  <script src="config/markets.js"></script>
  <script src="config/national.js"></script>
  <script src="config/sports.js"></script>
  <script src="config/live.js"></script>

  <!-- Load modules -->
  <script src="modules/fetcher.js"></script>
  <script src="modules/scorer.js"></script>
  <script src="modules/venue.js"></script>
  <script src="modules/display.js"></script>

  <!-- Load main app logic last -->
  <script src="app.js"></script>
</body>
</html>
