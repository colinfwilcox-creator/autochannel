<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoChannel — Live Game Dashboard</title>
  <!-- Base colours until styles.css arrives, so there's no white flash. -->
  <style>html, body { background: #0a0a0a; color: #e0e0e0; }</style>
  <script>
    // ┌─────────────────────────────────────────────────────────────────────┐
    // │ APP_VERSION: the ONE place the front-end version lives.              │
    // │ Bump it in every commit that changes index.html, app.js, styles.css, │
    // │ config/*.js or modules/*.js. Format: YYYY.MM.DD-N. See README.       │
    // └─────────────────────────────────────────────────────────────────────┘
    window.APP_VERSION = "2026.11.24-3";

    // Every stylesheet and script is requested as file?v=APP_VERSION, so a new
    // version is a new URL and browsers can't serve the old file from cache.
    window.versioned = function (path) {
      return path + "?v=" + encodeURIComponent(window.APP_VERSION);
    };
    (function () {
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = window.versioned("styles.css");
      document.head.appendChild(css);
    })();
  </script>
</head>
<body>
  <header class="simple-header">
    <h1>📺 AutoChannel</h1>
    <p id="status" class="status-line">Loading…</p>
  </header>

  <main>
    <div id="error-banner" class="error-banner" role="alert" hidden></div>

    <section id="simple-view" class="simple-view">
      <form id="simple-form" class="simple-form" autocomplete="on">
        <label class="field field-address">
          <span>Address</span>
          <input id="address" type="text" inputmode="text" autocomplete="street-address" placeholder="Street, city, ZIP">
        </label>
        <label class="field field-count">
          <span>TVs</span>
          <input id="tv-count" type="number" min="1" max="20" step="1" value="5" inputmode="numeric">
        </label>
      </form>
      <p id="address-message" class="address-message" hidden></p>

      <ol id="tv-list" class="tv-list" aria-label="What to put on each TV"></ol>
      <p id="simple-empty" class="empty-state" hidden></p>

      <section id="up-next" class="up-next" hidden>
        <h2>Up next</h2>
        <ul id="up-next-list"></ul>
      </section>
    </section>

    <button id="details-toggle" type="button" class="details-toggle" aria-expanded="false" aria-controls="details-view">Show details</button>

    <section id="details-view" class="details-view" hidden>
      <div id="dashboard" class="dashboard"></div>
    </section>
  </main>

  <footer class="app-footer">AutoChannel build <span id="app-version"></span></footer>

  <script>
    document.getElementById("app-version").textContent = window.APP_VERSION;

    // Load order matters: config, then modules, then app.js.
    // async = false makes dynamically added scripts run in this order.
    [
      "config/venue.js",
      "config/markets.js",
      "config/national.js",
      "config/sports.js",
      "config/live.js",
      "config/zip-markets.js",
      "config/channels.js",
      "config/programming.js",
      "modules/fetcher.js",
      "modules/scorer.js",
      "modules/venue.js",
      "modules/eligibility.js",
      "modules/display.js",
      "app.js"
    ].forEach(function (src) {
      var s = document.createElement("script");
      s.src = window.versioned(src);
      s.async = false;
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
